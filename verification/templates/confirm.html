{% load static %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    <div id="confirm-container">
      <h1 id="confirm-headline">Set password</h1>
      <div id="confirm-password-container" class="form-outline was-validated">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" minlength="8" name="password" placeholder="Password" required>
        <div class="progress mt-3" style="height: 5px;">
          <div id="progressbar" class="progress-bar progress-bar-striped progress-bar-animated bg-danger" role="progressbar" style="width: 1%;">
          </div>
        </div>
        <div id="feedbackin" class="valid-feedback"></div>
        <div id="feedbackirn" class="invalid-feedback">8 more characters, Special characters, Upper case letters, Lower case letters, Numbers</div>
        <label for="password-repetition" class="form-label mt-4">Re-enter password</label>
        <input type="password" id="password-repetition" class="form-control" placeholder="Re-enter password" required>
      </div>
      <button type="button" id="complete" class="btn btn-primary d-block px-4 mt-5 mx-auto">COMPLETE</button></br>
    </div>
  </body>
</html>

<script>
  document.getElementById('complete').onclick = function(event) {
    if (document.getElementById("password").value !== document.getElementById("password-repetition").value) {
      Swal.fire("Completion failed!", "The two passwords entered do not match", "error");
      return;
    }
    if (!passwordInput.checkValidity()) {
      Swal.fire("Completion failed!", "The selected password is not strong enough", "error");
      return;
    }
    let request = new HttpRequest("/verification/complete/", "POST", [],
      {member: "{{member}}", token: "{{token}}", password: document.getElementById("password").value});
    request.send(function (status, responseText) {
      window.location.href = "/";
    });
  };

  var passwordInput = document.getElementById("password");

  passwordInput.addEventListener('keypress', function(event) {
    updatePasswordProgress()
  });

  passwordInput.addEventListener('keyup', function(event) {
    updatePasswordProgress();
  });

  let passwordMatchedCases = [];
  passwordMatchedCases.push("[!@#$%&*_?]");
  passwordMatchedCases.push("[A-Z]");
  passwordMatchedCases.push("[a-z]");
  passwordMatchedCases.push("[0-9]");
  let passwordMessageCases = [];
  passwordMessageCases.push(" Special characters");
  passwordMessageCases.push(" Upper case letters");
  passwordMessageCases.push(" Lower case letters");
  passwordMessageCases.push(" Numbers");

  function updatePasswordProgress() {
    let messageCases = passwordMessageCases.slice();
    let status = 0;
    for (let i = 0; i < passwordMatchedCases.length; i++) {
      if (new RegExp(passwordMatchedCases[i]).test(passwordInput.value)) {
        messageCases.splice(messageCases.indexOf(passwordMessageCases[i]), 1);
        status++;
      }
    }
    if (passwordInput.value.length >= 8) {
      status++;
    }
    let progress;
    let strength;
    switch (status) {
      case 0:
        strength = "";
        progress = 1;
        break;
      case 1:
        strength = "Too Weak";
        progress = 15;
        break;
      case 2:
        strength = "Very Weak";
        progress = 30;
        break;
      case 3:
        strength = "Weak";
        progress = 45;
        break;
      default:
        strength = "Strong";
        progress = 75;
        break;
    }
    progress += passwordInput.value.length;
    let information = "";
    let progressBarClass;
    if (progress >= 75 && passwordInput.value.length >= 8) {
      passwordInput.setCustomValidity("");
      progressBarClass = "bg-success";
      information = "Strong";
    } else {
      passwordInput.setCustomValidity(strength);
      progressBarClass = "bg-danger";
      if(passwordInput.value.length < 8) {
        information += (8 - passwordInput.value.length) + " more characters";
      }
      information += messageCases;
    }
    $("#feedbackin, #feedbackirn").text(information);
    $("#progressbar").removeClass("bg-danger bg-warning bg-success").addClass(progressBarClass);
    $("#progressbar").width(progress + "%");
  }
</script>

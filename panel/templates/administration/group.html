{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'panel-header.html' %}
    {% include 'panel-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="group-container">
        <div id="group-wrapper" class="d-none">
          <div id="group-header">
            <div class="w-25 text-start">
              <button id="group-delete" type="button" class="btn btn-danger">{% trans 'panel.group.delete' %}</button>
            </div>
            <div id="group-headline-wrapper">
              <h1 id="group-headline" class="mx-2"></h1>
            </div>
            <div class="w-25 text-end">
              <button id="group-rename" type="button" class="fa-solid fa-pen-to-square"></button>
            </div>
          </div>
          <div id="group-priority-header">
            <h2>{% trans 'panel.group.priority.headline' %}</h2>
          </div>
          <div id="group-priority-container" class="my-4">
            <input id="group-priority-input" type="number" min="0" max="100" placeholder="{% trans 'panel.group.priority' %}">
            <button id="group-priority-change" class="btn btn-success" type="button">{% trans 'panel.group.priority.change' %}</button>
          </div>
          <div id="group-members-header">
            <h2>{% trans 'panel.group.members.headline' %}</h2>
            <button id="group-member-add" class="btn btn-success" type="button">{% trans 'panel.group.member.add' %}</button>
          </div>
          <ul id="group-members">
          </ul>
          <div id="group-permissions-header">
            <h2>{% trans 'panel.group.permissions.headline' %}</h2>
            <button id="group-permission-add" class="btn btn-success" type="button">{% trans 'panel.group.permission.add' %}</button>
          </div>
          <ul id="group-permissions">
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var group;
  var members;

  $(document).ready(function() {
    displayLoader();
    fetchGroupsData(function() {
      fetchMembersData(function() {
        displayGroup();
        removeLoader();
      });
    });
  });

  function fetchGroupsData(callback) {
    let request = new HttpRequest("https://team.dulno.com/v1/groups/", "GET", []);
    request.send(function (status, responseText) {
      group = JSON.parse(responseText).groups.filter((group) => group.name.toLowerCase() === "{{group}}".toLowerCase())[0];
      callback();
    });
  }

  function fetchMembersData(callback) {
    let request = new HttpRequest("https://team.dulno.com/v1/members/", "GET", []);
    request.send(function (status, responseText) {
      members = JSON.parse(responseText).members.filter((member) => member.group.toLowerCase() === "{{group}}".toLowerCase());
      callback();
    });
  }

  function displayGroup() {
    document.getElementById("group-headline").innerHTML = group.name;
    document.getElementById("group-priority-input").value = group.priority;
    for (var i = 0; i < members.length; i++) {
      var member = members[i];
      document.getElementById("group-members").appendChild(
        createTeamMemberElement(member.id, member.name, member.profilePicture));
    }
    if (members.length === 0) {
      var groupEmptyElement = document.createElement("h6");
      groupEmptyElement.classList.add("mt-4");
      groupEmptyElement.innerHTML = "{% trans 'panel.group.empty' %}";
      document.getElementById("group-members").appendChild(groupEmptyElement);
    }
    for (var i = 0; i < group.permissions.length; i++) {
      document.getElementById("group-permissions").appendChild(
        createPermissionElement(group.permissions[i]));
    }
    if (group.permissions.length === 0) {
      var groupPermissionsEmptyElement = document.createElement("h6");
      groupPermissionsEmptyElement.classList.add("mt-4");
      groupPermissionsEmptyElement.innerHTML = "{% trans 'panel.group.permissions.empty' %}";
      document.getElementById("group-permissions").appendChild(groupPermissionsEmptyElement);
    }
  }

  document.getElementById("group-priority-change").onclick = function (event) {
    var priority = document.getElementById("group-priority-input").value;
    let request = new HttpRequest("https://team.dulno.com/v1/group/priority/change/", "POST", [], {priority: priority, name: group.name});
    request.send(function (status, responseText) {
      Swal.fire("{% trans 'panel.group.priority.changed.title' %}", "{% trans 'panel.group.priority.changed.body' %}", "success").then(success => window.location.reload());
    });
  }

  function createTeamMemberElement(memberId, memberName, profilePicture) {
    var memberElement = document.createElement("li");
    memberElement.classList.add("group-member");
    var memberInformationContainer = document.createElement("div");
    memberInformationContainer.classList.add("group-member-information");
    var memberIconElement = document.createElement("i");
    memberIconElement.classList.add("group-member-icon", "fa-regular", "fa-user");
    memberInformationContainer.appendChild(memberIconElement);
    var memberNameElement = document.createElement("span");
    memberNameElement.classList.add("group-member-name");
    memberNameElement.innerHTML = memberName;
    memberInformationContainer.appendChild(memberNameElement);
    memberElement.appendChild(memberInformationContainer);
    var memberRemoveElement = document.createElement("span");
    memberRemoveElement.classList.add("group-member-remove", "fa", "fa-ban", "text-danger");
    memberRemoveElement.onclick = function (event) {
      let request = new HttpRequest("https://team.dulno.com/v1/member/remove/", "POST",
        [], {member: memberId});
      request.send(function (status, responseText) {
        location.reload();
      });
    }
    memberElement.appendChild(memberRemoveElement);
    return memberElement;
  }

  document.getElementById("group-member-add").onclick = function (event) {
    var content = document.createElement("div");
    content.classList.add("group-member-add-content");
    var text = document.createElement("p");
    text.innerText = "{% trans 'panel.group.member.add.body' %}";
    content.appendChild(text);
    var email = document.createElement("input");
    email.placeholder = "{% trans 'panel.group.member.add.email' %}";
    content.appendChild(email);
    var name = document.createElement("input");
    name.classList.add("mt-2");
    name.placeholder = "{% trans 'panel.group.member.add.name' %}";
    content.appendChild(name);
    Swal.fire({
      title: "{% trans 'panel.group.member.add.title' %}",
      html: content,
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://team.dulno.com/v1/member/add/", "POST", [],
          {email: email.value, name: name.value, group: group.name});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'panel.group.member.add.successful.title' %}", "{% trans 'panel.group.member.add.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }

  function createPermissionElement(permission) {
    var permissionElement = document.createElement("li");
    permissionElement.classList.add("group-permission");
    var permissionNameElement = document.createElement("div");
    permissionNameElement.classList.add("group-permission-name");
    permissionNameElement.innerHTML = "• \"" + permission + "\"";
    permissionElement.appendChild(permissionNameElement);
    var permissionRemoveElement = document.createElement("span");
    permissionRemoveElement.classList.add("group-permission-remove", "fa", "fa-ban", "text-danger");
    permissionRemoveElement.onclick = function (event) {
      let request = new HttpRequest("https://team.dulno.com/v1/group/permission/remove/", "POST", [],
        {permission: permission, name: group.name});
      request.send(function (status, responseText) {
        location.reload();
      });
    }
    permissionElement.appendChild(permissionRemoveElement);
    return permissionElement;
  }

  document.getElementById("group-permission-add").onclick = function (event) {
    var content = document.createElement("div");
    content.classList.add("group-permission-add-content");
    var text = document.createElement("p");
    text.innerText = "{% trans 'panel.group.permission.add.body' %}";
    content.appendChild(text);
    var input = document.createElement("input");
    input.placeholder = "{% trans 'panel.group.permission.add.name' %}";
    content.appendChild(input);
    Swal.fire({
      title: "{% trans 'panel.group.permission.add.title' %}",
      html: content,
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://team.dulno.com/v1/group/permission/add/", "POST", [],
          {permission: input.value, name: group.name});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'panel.group.permission.add.successful.title' %}", "{% trans 'panel.group.permission.add.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }

  document.getElementById("group-delete").onclick = function(event) {
    Swal.fire({
      title: "{% trans 'panel.group.delete.title' %}",
      text: "{% trans 'panel.group.delete.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://team.dulno.com/v1/group/remove/", "POST", [],
          {name: group.name});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'panel.group.delete.successful.title' %}", "{% trans 'panel.group.delete.successful.body' %}", "success").then(success => window.location.href = "/administration/");
        });
      }
    });
  }

  document.getElementById("group-rename").onclick = function(event) {
    var content = document.createElement("div");
    content.classList.add("group-rename-content");
    var text = document.createElement("p");
    text.innerText = "{% trans 'panel.group.rename.body' %}";
    content.appendChild(text);
    var input = document.createElement("input");
    input.placeholder = "{% trans 'panel.group.rename.name' %}";
    content.appendChild(input);
    Swal.fire({
      title: "{% trans 'panel.group.rename.title' %}",
      html: content,
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://team.dulno.com/v1/group/rename/", "POST", [],
          {currentName: group.name, newName: input.value});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'panel.group.rename.successful.title' %}", "{% trans 'panel.group.rename.successful.body' %}", "success")
            .then(success => window.location.href = "/group/" + input.value + "/");
        });
      }
    });
  }

  function displayLoader() {
    var loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("group-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("group-container")
      .removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("group-wrapper").classList.remove("d-none");
  }
</script>

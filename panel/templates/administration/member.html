{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/panel-header.html' %}
    {% include 'templates/panel-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="member-wrapper">
        <h1 id="member-headline"></h1>
        <div id="member-group-header">
          <h2>{% trans 'panel.member.group.headline' %}</h2>
        </div>
        <div id="member-group-dropdown" class="dropdown">
          <button id="member-group-dropdown-button" class="btn btn-secondary dropdown-toggle bg-dark my-4" type="button" data-bs-toggle="dropdown">
            {% trans 'panel.member.group' %}
          </button>
          <ul id="member-group-dropdown-list" class="dropdown-menu dropdown-menu-dark">
          </ul>
        </div>
        <div id="member-permissions-header">
          <h2>{% trans 'panel.member.permissions.headline' %}</h2>
          <button id="member-permission-add" class="btn btn-success" type="button">{% trans 'panel.member.permission.add' %}</button>
        </div>
        <ul id="member-permissions">
        </ul>
      </div>
    </div>
  </body>
</html>

<script>
  var member;
  var groups;

  $(document).ready(function() {
    fetchMembersData(function() {
      fetchGroupsData(function() {
        displayMember();
      });
    });
  });

  function fetchMembersData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/team/members/", "GET", []);
    request.send(function (status, responseText) {
      member = JSON.parse(responseText).members.filter((member) => member.id === "{{member}}")[0];
      callback();
    });
  }

  function fetchGroupsData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/team/groups/", "GET", []);
    request.send(function (status, responseText) {
      groups = JSON.parse(responseText).groups.sort(function(firstGroup, secondGroup) {
        return secondGroup.priority - firstGroup.priority;
      });
      callback();
    });
  }

  function displayMember() {
    document.getElementById("member-headline").innerHTML = member.name;
    document.getElementById("member-group-dropdown-button").innerHTML = "{% trans 'panel.member.group' %}: " + member.group;
    for (var i = 0; i < groups.length; i++) {
      addGroup(groups[i].name);
    }
    for (var i = 0; i < member.permissions.length; i++) {
      document.getElementById("member-permissions").appendChild(
        createPermissionElement(member.permissions[i]));
    }
    if (member.permissions.length === 0) {
      var groupPermissionsEmptyElement = document.createElement("h6");
      groupPermissionsEmptyElement.classList.add("mt-4");
      groupPermissionsEmptyElement.innerHTML = "{% trans 'panel.member.permissions.empty' %}";
      document.getElementById("member-permissions").appendChild(groupPermissionsEmptyElement);
    }
  }

  function addGroup(group) {
    var groupElement = document.createElement("li");
    groupElement.classList.add("dropdown-item");
    var groupNameName = document.createElement("b");
    groupNameName.innerHTML = group;
    groupElement.appendChild(groupNameName);
    groupElement.onclick = function(event) {
      selectGroup(group);
    }
    document.getElementById("member-group-dropdown-list").appendChild(groupElement);
  }

  function selectGroup(group) {
    document.getElementById("member-group-dropdown-button").innerHTML = "{% trans 'panel.member.group' %}: " + group;
    let request = new HttpRequest("https://api.taskwolf.net/v1/team/member/group/change/", "POST", [],
      {group: group, member: member.id});
    request.send(function (status, responseText) {

    });
  }

  function createPermissionElement(permission) {
    var permissionElement = document.createElement("li");
    permissionElement.classList.add("member-permission");
    var permissionNameElement = document.createElement("div");
    permissionNameElement.classList.add("member-permission-name");
    permissionNameElement.innerHTML = "• \"" + permission + "\"";
    permissionElement.appendChild(permissionNameElement);
    var permissionRemoveElement = document.createElement("span");
    permissionRemoveElement.classList.add("member-permission-remove", "fa", "fa-ban", "text-danger");
    permissionRemoveElement.onclick = function (event) {
      let request = new HttpRequest("https://api.taskwolf.net/v1/team/member/permission/remove/", "POST", [],
        {permission: permission, member: member.id});
      request.send(function (status, responseText) {
        location.reload();
      });
    }
    permissionElement.appendChild(permissionRemoveElement);
    return permissionElement;
  }

  document.getElementById("member-permission-add").onclick = function (event) {
    swal({
      title: "{% trans 'panel.member.permission.add.title' %}",
      text: "{% trans 'panel.member.permission.add.body' %}",
      content: {
        element: "input",
        attributes: {
          placeholder: "{% trans 'panel.member.permission.add.name' %}",
        },
      },
      icon: "info",
      buttons: true,
    }).then(result => {
      if (result != null) {
        let request = new HttpRequest("https://api.taskwolf.net/v1/team/member/permission/add/", "POST", [],
          {permission: result, member: member.id});
        request.send(function (status, responseText) {
          swal("{% trans 'panel.member.permission.add.successful.title' %}", "{% trans 'panel.member.permission.add.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }
</script>

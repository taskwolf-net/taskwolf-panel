{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'panel-header.html' %}
    {% include 'panel-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="user-mail-container">
        <div id="user-mail-wrapper" class="d-none">
          {% include 'entity-tab.html' %}
          <div id="user-mails">
            <h4 class="fw-bold mb-4">{% trans 'user.mail.headline' %}</h4>
            <ul id="user-mail-list">
            </ul>
            <div id="user-mail-empty" class="text-center d-none">
              <span>{% trans 'user.mail.empty' %}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    displayLoader();
    fetchMails(function (mails) {
      displayMails(mails);
      removeLoader();
    });
  });

  function displayMails(mails) {
    for (var i = 0; i < mails.length; i++) {
      var entry = mails[i];
      displayMail(entry.id, entry.sender, entry.time, entry.title);
    }
    if (mails.length === 0) {
      document.getElementById("user-mail-empty").classList.remove("d-none");
    }
  }

  function displayMail(id, sender, time, title) {
    var entryElement = document.createElement("div");
    entryElement.classList.add("user-mail-entry");
    var prefixElement = document.createElement("div");
    prefixElement.classList.add("user-mail-entry-prefix", "d-flex", "align-items-center");
    var iconElement = document.createElement("h2");
    iconElement.classList.add("user-mail-icon", "fa-solid", "fa-envelope");
    prefixElement.appendChild(iconElement);
    var informationElement = document.createElement("div");
    informationElement.classList.add("w-100");
    var titleElement = document.createElement("p");
    titleElement.classList.add("user-mail-status", "fw-bold", "text-truncate");
    titleElement.innerHTML = title;
    informationElement.appendChild(titleElement);
    var senderElement = document.createElement("p");
    senderElement.classList.add("mb-0", "text-truncate");
    senderElement.innerHTML = sender;
    informationElement.appendChild(senderElement);
    var timeElement = document.createElement("p");
    timeElement.classList.add("mb-0", "text-truncate");
    timeElement.innerHTML = new Date(time).toLocaleString();
    informationElement.appendChild(timeElement);
    prefixElement.appendChild(informationElement);
    entryElement.appendChild(prefixElement);
    var entrySuffix = document.createElement("div");
    entrySuffix.classList.add("d-flex", "align-items-center");
    var settingsButton = document.createElement("button");
    settingsButton.type = "button";
    settingsButton.classList.add("user-mail-settings-button", "fa-solid",
      "fa-ellipsis-vertical");
    settingsButton.setAttribute("data-bs-toggle", "dropdown");
    settingsButton.setAttribute("aria-expanded", "false");
    entrySuffix.appendChild(settingsButton);
    var dropdown = createMailSettingsDropdown([{icon: "fa-arrows-rotate",
      content: "{% trans 'user.mail.settings.resend' %}",
      click: () => resendMail(id)}]);
    entrySuffix.appendChild(dropdown);
    entryElement.appendChild(entrySuffix);
    document.getElementById("user-mail-list").appendChild(entryElement);
  }

  function createMailSettingsDropdown(buttons) {
    var dropdown = document.createElement("ul");
    dropdown.classList.add("user-mail-settings-dropdown", "dropdown-menu");
    for (var i = 0; i < buttons.length; i++) {
      var button = buttons[i];
      dropdown.appendChild(createMailSettingsDropdownButton(dropdown, button.icon,
        button.content, button.click));
    }
    return dropdown;
  }

  function createMailSettingsDropdownButton(dropdown, icon, content, click) {
    var dropdownEntry = document.createElement("li");
    dropdownEntry.classList.add("user-mail-settings-dropdown-entry", "dropdown-item");
    var dropdownEntryIcon = document.createElement("i");
    dropdownEntryIcon.classList.add("fa-solid", icon);
    dropdownEntry.appendChild(dropdownEntryIcon);
    var dropdownEntryLabel = document.createElement("label");
    dropdownEntryLabel.innerText = content;
    dropdownEntry.appendChild(dropdownEntryLabel);
    dropdownEntry.onclick = function (event) {
      $(dropdown).dropdown('toggle');
      click();
    };
    return dropdownEntry;
  }

  function resendMail(id) {
    let request = new HttpRequest("https://team.dulno.com/v1/mail/resend/", "POST",
      [], {mail: id});
    request.send(function (status, responseText) {
      Swal.fire("{% trans 'mail.resend.successful.title' %}",
        "{% trans 'mail.resend.successful.body' %}", "success")
        .then(success => window.location.reload());
    });
  }

  function fetchMails(callback) {
    let request = new HttpRequest("https://team.dulno.com/v1/mails/find/", "POST",
      [], {user: "{{user}}"});
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText).mails);
    });
  }

  function displayLoader() {
    var loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("user-mail-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("user-mail-container")
      .removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("user-mail-wrapper").classList.remove("d-none");
  }
</script>

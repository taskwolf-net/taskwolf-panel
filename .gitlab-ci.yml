stages:
  - publish
  - deploy

variables:
  DOCKER_IMAGE: "dulno-panel"
  DOCKER_PROXY_IMAGE: "dulno-panel-proxy"
  KUBERNETES_RESOURCE: "deployment/dulno-panel-deployment"
  KUBERNETES_PROXY_RESOURCE: "deployment/dulno-panel-proxy-deployment"

publish:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
    - docker build -t $DOCKER_REGISTRY/$DOCKER_IMAGE:latest .
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker buildx build -t $DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:latest -f proxy/Dockerfile .
    - docker push $DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:latest
  only:
    - master

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout restart $KUBERNETES_PROXY_RESOURCE
  only:
    - master
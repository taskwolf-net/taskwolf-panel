{% load static %}
{% load i18n %}
<div class="bg-dark collapse collapse-horizontal" id="sidebar">
  <div id="sidebar-content">
    <ul id="panel-sidebar-items" class="navbar-nav ml-auto mt-4 h-100 d-flex align-items-center">
      <li class="sidebar-item">
        <a href="/dashboard/" class="sidebar-link nav-link {% if request.path == '/dashboard/' or request.path == '/' %}sidebar-active{% endif %}" aria-current="page"><i class="sidebar-icon fa fa-home" aria-hidden="true"></i>{% trans 'panel.sidebar.dashboard' %}</a>
      </li>
      <li class="sidebar-item">
        <a href="/tickets/" class="sidebar-link nav-link {% if 'ticket' in request.path %}sidebar-active{% endif %}" aria-current="page"><i class="sidebar-icon fa fa-ticket" aria-hidden="true"></i>{% trans 'panel.sidebar.tickets' %}</a>
      </li>
      <li class="sidebar-item">
        <a href="/questions/" class="sidebar-link nav-link {% if 'question' in request.path %}sidebar-active{% endif %}" aria-current="page"><i class="sidebar-icon fa fa-handshake-angle" aria-hidden="true"></i>{% trans 'panel.sidebar.questions' %}</a>
      </li>
      <li class="sidebar-item">
        <a href="/sales/" class="sidebar-link nav-link {% if 'sale' in request.path %}sidebar-active{% endif %}" aria-current="page"><i class="sidebar-icon fa fa-arrow-trend-up" aria-hidden="true"></i>{% trans 'panel.sidebar.sales' %}</a>
      </li>
      <li id="administration-sidebar-item" class="sidebar-item d-none">
        <a href="/administration/" class="sidebar-link nav-link {% if '/administration/' in request.path or '/group/' in request.path or '/member/' in request.path %}sidebar-active{% endif %}" aria-current="page"><i class="sidebar-icon fa   fa-user-tie" aria-hidden="true"></i>{% trans 'panel.sidebar.administrator' %}</a>
      </li>
    </ul>
  </div>
</div>

<script>
  $(document).ready(function() {
    let request = new HttpRequest("https://team.taskwolf.net/v1/member/has/permission/", "POST", [],
      {permission: "administrator"});
    request.send(function (status, responseText) {
      if (JSON.parse(responseText).hasPermission === true) {
        document.getElementById("administration-sidebar-item").classList.remove("d-none");
      }
    });
  });
</script>
